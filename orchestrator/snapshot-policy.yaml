contract:
  id: TU-SNAPSHOT-POLICY
  version: 1.0.0
  status: canonical
owner: t-understand
source_repository:
  access: READ_ONLY
  git_mutation: deny
  optional_git_locks: disabled
snapshot_ids:
  immutable: true
  reuse: deny
application_snapshot:
  portable: true
  absolute_paths: deny
  repository_order: repository-id-ascending
  output: snapshots/<snapshot-id>/application-snapshot.yaml
repository_targets:
  branch:
    ref_required: true
    capture: resolved-commit-tree
  tag:
    ref_required: true
    capture: resolved-commit-tree
  commit:
    ref_required: true
    ref_format: hexadecimal-object-id
    capture: resolved-commit-tree
  head:
    ref_required: false
    capture: resolved-commit-tree
  index:
    ref_required: false
    capture: head-plus-staged-binary-patch
    excludes:
    - unstaged
    - untracked
  worktree:
    ref_required: false
    capture: head-plus-staged-and-unstaged-binary-patches-plus-nonignored-untracked-files
worktree_capture:
  ignored_files: exclude
  protected_paths: deny
  untracked_symlinks: deny
  dirty_submodules: deny
  maximum_patch_bytes: 20971520
  maximum_untracked_file_bytes: 10485760
  maximum_total_untracked_bytes: 52428800
  race_detection: required
  validate_before_commit: true
integrity:
  descriptor_sha256: required
  artifact_sha256: required
  content_digest: required
  snapshot_directory_commit: atomic-rename
  drift_check: explicit
review_target:
  immutable: true
  source: validated-application-snapshots-only
  modes:
  - STATIC_AUDIT
  - DIFF
  update: deny
  output: reviews/<review-id>/review-target.yaml
