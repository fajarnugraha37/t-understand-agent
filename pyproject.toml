[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "t-understand"
version = "1.0.2"
description = "Evidence-first multi-repository understanding, canonical memory, documentation, QnA, code review, quality qualification, and platform packaging"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "jsonschema>=4.20"]

[project.scripts]
t-understand = "tu_runtime.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["runtime"]
include = ["tu_runtime*"]

[tool.t-understand]
phase = 20
contract_version = "2.0.0"
runtime_contract_version = "2.0.0"
