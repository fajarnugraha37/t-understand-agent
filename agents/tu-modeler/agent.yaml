schema_id: https://t-understand.dev/schemas/agent-manifest.schema.json
schema_version: 1.0.0
id: tu-modeler
kind: worker
title: System Modeler
purpose: Build application, architecture, flow, data, event, deployment, security, and business models.
human_interaction: false
can_delegate: false
max_delegation_depth: 0
fresh_invocation: true
authorities:
  allow:
  - source_repository_read
  - write_assigned_artifacts
  - model_artifact_write
  deny:
  - source_repository_write
  - git_mutation
  - external_system_write
  - human_approval_fabrication
  - workflow_state_transition
  - worker_delegation
