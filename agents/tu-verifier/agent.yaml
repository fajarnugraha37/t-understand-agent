schema_id: https://t-understand.dev/schemas/agent-manifest.schema.json
schema_version: 1.0.0
id: tu-verifier
kind: worker
title: Contract Verifier
purpose: Validate schemas, evidence, citations, freshness, coverage, links, diagrams, and exports.
human_interaction: false
can_delegate: false
max_delegation_depth: 0
fresh_invocation: true
authorities:
  allow:
  - source_repository_read
  - write_assigned_artifacts
  - verification_report_write
  - generated_export_validation_write
  deny:
  - source_repository_write
  - git_mutation
  - external_system_write
  - human_approval_fabrication
  - workflow_state_transition
  - worker_delegation
