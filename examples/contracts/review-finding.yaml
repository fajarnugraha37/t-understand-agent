title: Publication can escape transaction failure
observation: The event is published before the transaction commit is known to have succeeded.
evidence:
- EVD-ORDER-001
failure_scenario:
- Event publication succeeds.
- Database transaction commit fails.
- Consumers observe an order that is not committed.
technical_impact:
- Persisted state and downstream state can diverge.
business_impact:
- Downstream fulfillment may act on a nonexistent order.
recommendation: Publish through the transactional outbox mechanism.
required_verification:
- Test commit failure after outbox insert.
- Test duplicate delivery handling.
