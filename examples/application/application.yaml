schema_id: https://t-understand.dev/schemas/application-manifest.schema.json
schema_version: 1.0.0
application:
  id: application-a
  name: Application A
  description: Example multi-repository application.
workspace_model: multi-repo
repositories:
- id: repo-a
  name: Repository A
  role: backend-service
  vcs: git
  identity:
    type: remote
    value: github.com/example/repo-a
  remote_hint: https://github.com/example/repo-a.git
  source_access: READ_ONLY
- id: repo-b
  name: Repository B
  role: frontend
  vcs: git
  identity:
    type: explicit
    value: example/internal-repo-b
  source_access: READ_ONLY
