name: Agent policy integration

on:
  push:
    branches:
      - feature/graphify-first-repository-intelligence
      - feature/ponytail-first-engineering-policy
    paths:
      - "agents/**"
      - "adapters/**"
      - "orchestrator/**"
      - "schemas/**"
      - "skills/**"
      - "runtime/**"
      - "scripts/**"
      - "tests/**"
      - "docs/graphify-first-repository-intelligence.md"
      - "docs/ponytail-first-engineering.md"
      - "examples/repository-intelligence.yaml"
      - "examples/ponytail-context.yaml"
      - "Makefile"
      - "pyproject.toml"
      - ".github/workflows/graphify-integration.yml"
  pull_request:
    branches:
      - main
    paths:
      - "agents/**"
      - "adapters/**"
      - "orchestrator/**"
      - "schemas/**"
      - "skills/**"
      - "runtime/**"
      - "scripts/**"
      - "tests/**"
      - "docs/graphify-first-repository-intelligence.md"
      - "docs/ponytail-first-engineering.md"
      - "examples/repository-intelligence.yaml"
      - "examples/ponytail-context.yaml"
      - "Makefile"
      - "pyproject.toml"
      - ".github/workflows/graphify-integration.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Static syntax
        run: |
          python -m compileall -q runtime tests scripts
          bash -n bin/t-understand
      - name: Shared policy contracts
        env:
          PYTHONPATH: scripts:.
        run: |
          python scripts/validate_graphify_integration.py --report reports/graphify-integration-report.json
          python scripts/run_graphify_tests.py --report reports/graphify-test-report.json
          python scripts/validate_ponytail_integration.py --report reports/ponytail-integration-report.json
          python scripts/run_ponytail_tests.py --report reports/ponytail-test-report.json
      - name: Agent-native regression
        env:
          PYTHONPATH: runtime:.
        run: make agent-native-contract agent-native-tests agent-native-cli
      - name: Full repository verification from clean export
        run: |
          verify_root="$RUNNER_TEMP/t-understand-verify"
          rm -rf "$verify_root"
          mkdir -p "$verify_root"
          git archive HEAD | tar -x -C "$verify_root"
          chmod +x "$verify_root/bin/t-understand"
          python -m pip install -e "$verify_root"
          rm -rf "$verify_root/runtime/t_understand.egg-info"
          set +e
          (
            cd "$verify_root"
            PYTHONPATH=runtime:. make verify
          ) 2>&1 | tee reports/full-verification.log
          verify_status=${PIPESTATUS[0]}
          rm -rf reports/clean-export
          mkdir -p reports/clean-export
          cp -R "$verify_root/reports/." reports/clean-export/
          if [ -f "$verify_root/CHECKSUMS.sha256" ]; then
            cp "$verify_root/CHECKSUMS.sha256" reports/clean-export/CHECKSUMS.sha256
          fi
          exit "$verify_status"
      - name: Capture workspace status
        if: always()
        run: git status --short > reports/agent-policy-generated-status.txt
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-policy-validation-evidence
          if-no-files-found: error
          path: reports/**
